<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="GitHub 开源日刊 2026-08-04：5 个值得立即试用的新开源项目"><title>GitHub 开源日刊 · 2026-08-04</title><style>:root{--bg:#f5f7fb;--paper:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--brand:#ef624d;--accent:#6558df;--green:#087a67}html[data-theme=dark]{--bg:#0c1119;--paper:#171e2a;--text:#f4f6fa;--muted:#aab3c2;--line:#30394a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,rgba(239,98,77,.15),transparent 28%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}a{color:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}nav{height:68px;display:flex;align-items:center;gap:12px}.logo{background:linear-gradient(135deg,var(--brand),#ffad54);color:#fff;text-decoration:none;border-radius:13px;padding:8px 10px;font-weight:900}.brand{font-weight:900}.links{margin-left:auto;display:flex;gap:12px}.links a,.links button{border:0;background:none;color:var(--muted);text-decoration:none;cursor:pointer}.hero{padding:65px 0 25px}.hero>div,.toolbar,.card,.table{background:var(--paper);border:1px solid var(--line);border-radius:24px}.hero>div{padding:44px}h1{font-size:clamp(2.7rem,7vw,5.6rem);line-height:1;letter-spacing:-.06em;margin:15px 0}.kicker{color:var(--brand);font-weight:900}.muted{color:var(--muted)}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:.85rem}section{padding:25px 0}.toolbar{padding:13px;display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:9px;position:sticky;top:78px;z-index:15}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--paper);color:var(--text)}.toc{display:flex;gap:8px;flex-wrap:wrap}.toc a{border:1px solid var(--line);border-radius:999px;padding:7px 10px;text-decoration:none;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{overflow:hidden}.cover{aspect-ratio:2/1;background:#e8edf5}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:20px}.head{display:flex;gap:10px;align-items:start}.head h2{margin:0}.tag{margin-left:auto;background:color-mix(in srgb,var(--accent) 10%,var(--paper));color:var(--accent);padding:5px 8px;border-radius:999px;font-size:.78rem;font-weight:900}.repo{font-family:monospace;color:var(--muted);font-size:.82rem}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.metric{border:1px solid var(--line);border-radius:11px;padding:9px}.metric b{display:block}.metric small{color:var(--muted)}.signal{color:var(--green);background:color-mix(in srgb,var(--green) 9%,var(--paper));padding:10px;border-radius:11px}details{margin-top:12px}summary{cursor:pointer;font-weight:900}.box{border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}.box p,.box ul{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;padding:8px 11px;text-decoration:none;font-weight:800}.btn.primary{background:var(--text);color:var(--bg)}.table{padding:20px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}footer{padding:40px 0;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.links a:first-child{display:none}}</style></head><body><header class="top"><nav class="wrap"><a class="logo" href="./">GH</a><span class="brand">GitHub 开源期刊</span><div class="links"><a href="#projects">本期项目</a><a href="./archive/">历史归档</a><a href="https://github.com/waterfly9527-ui/github-periodical">GitHub</a><button onclick="theme()">◐</button></div></nav></header><main><section class="hero wrap"><div><span class="kicker">LATEST DAILY · 2026-08-04</span><h1>5 个值得立即试用的<br>新开源项目</h1><p class="muted">首页直接展示最新一期正文。本期避开上一版已推荐项目，聚焦原生编译、Agent 沙箱、AI CRM、推理基础设施和边缘数据库 AI。</p><div class="pills"><span class="pill">快照：2026-08-04</span><span class="pill">5 个项目</span><span class="pill">事实来源：仅 GitHub</span><span class="pill">数字为生成时快照</span></div></div></section><section class="wrap"><h2>快速目录</h2><div id="toc" class="toc"></div></section><section id="projects" class="wrap"><div class="toolbar"><input id="q" placeholder="搜索项目、能力、语言或人群…"><select id="cat"><option value="">全部分类</option></select><select id="sort"><option value="stars_snapshot">按 Stars</option><option value="forks_snapshot">按 Forks</option><option value="name">按名称</option></select></div><p id="count" class="muted"></p><div id="grid" class="grid"></div></section><section class="wrap"><h2>数据快照</h2><div class="table"><table><thead><tr><th>项目</th><th>分类</th><th>语言</th><th>License</th><th>Stars</th><th>Forks</th></tr></thead><tbody id="tb"></tbody></table></div></section></main><footer><div class="wrap">仓库事实来自 GitHub；推荐理由与采用建议为编辑判断。<a href="./archive/">查看历史期刊</a>。</div></footer><script>function theme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n)}document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';let P=[];const fmt=n=>new Intl.NumberFormat('zh-CN').format(n);fetch('./data/projects.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{P=d.projects;P.forEach(x=>{x.image='https://opengraph.githubassets.com/20260804/'+x.repo;x.fallback='https://github.com/'+x.repo.split('/')[0]+'.png?size=240'});[...new Set(P.map(x=>x.category))].forEach(x=>cat.add(new Option(x,x)));toc.innerHTML=P.map((x,i)=>`<a href="#p${i}">${i+1}. ${x.name}</a>`).join('');tb.innerHTML=P.map(x=>`<tr><td><a href="${x.url}"><b>${x.name}</b></a></td><td>${x.category}</td><td>${x.language}</td><td>${x.license}</td><td>${fmt(x.stars_snapshot)}</td><td>${fmt(x.forks_snapshot)}</td></tr>`).join('');render()});function render(){let s=q.value.toLowerCase(),a=P.filter(x=>(!cat.value||x.category===cat.value)&&JSON.stringify(x).toLowerCase().includes(s));a.sort((x,y)=>sort.value==='name'?x.name.localeCompare(y.name):y[sort.value]-x[sort.value]);grid.innerHTML=a.map((x,i)=>`<article class="card" id="p${P.indexOf(x)}"><div class="cover"><img src="${x.image}" onerror="this.onerror=null;this.src='${x.fallback}';this.style.objectFit='contain';this.style.padding='30px'"></div><div class="body"><div class="head"><div><h2>${x.name}</h2><div class="repo">${x.repo}</div></div><span class="tag">${x.category}</span></div><p class="muted">${x.summary}</p><div class="metrics"><div class="metric"><b>★ ${fmt(x.stars_snapshot)}</b><small>Stars</small></div><div class="metric"><b>⑂ ${fmt(x.forks_snapshot)}</b><small>Forks</small></div><div class="metric"><b>${x.language}</b><small>语言</small></div><div class="metric"><b>${x.license}</b><small>License</small></div></div><div class="signal">${x.activity_signal}</div><details><summary>展开项目解读</summary><div class="box"><b>推荐理由</b><p>${x.recommendation}</p></div><div class="box"><b>适合人群</b><p>${x.audience}</p></div><div class="box"><b>主要能力</b><ul>${x.capabilities.map(v=>`<li>${v}</li>`).join('')}</ul></div></details><div class="actions"><a class="btn primary" href="${x.url}">打开 GitHub</a><a class="btn" href="${x.url}/commits">提交记录</a><a class="btn" href="${x.url}/issues">Issues</a></div></div></article>`).join('');count.textContent=`显示 ${a.length} / ${P.length} 个项目`}[q,cat,sort].forEach(e=>e.oninput=render);</script></body></html>
