<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 开源日刊 · 2026-08-05</title><style>:root{--b:#f5f7fb;--p:#fff;--t:#172033;--m:#687386;--l:#dfe5ee;--a:#5b61e8}html[data-theme=dark]{--b:#0d121a;--p:#171e29;--t:#f4f6fa;--m:#a8b1c0;--l:#303a4b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;line-height:1.65}.w{width:min(1120px,calc(100% - 32px));margin:auto}nav{position:sticky;top:0;z-index:20;background:var(--b);border-bottom:1px solid var(--l)}nav .w{min-height:64px;display:flex;align-items:center;gap:14px}nav b{margin-right:auto}a{color:inherit}button,input,select{font:inherit}.hero{padding:52px 0 22px}.hero .w{background:#111827;color:#fff;border-radius:28px;padding:42px}h1{font-size:clamp(2.6rem,6vw,5rem);line-height:1;letter-spacing:-.05em;margin:14px 0}.lead{color:#c8d0dc}.meta,.toc{display:flex;gap:8px;flex-wrap:wrap}.pill,.toc a{padding:7px 11px;border-radius:999px;border:1px solid var(--l);text-decoration:none}.hero .pill{border-color:#ffffff33}.dedup{margin-top:16px;padding:12px;border-radius:12px;background:#22c55e22;color:#dcffe7}section{padding:24px 0}.toolbar{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:9px;background:var(--p);border:1px solid var(--l);padding:12px;border-radius:16px;position:sticky;top:75px;z-index:10}input,select,button{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:10px;padding:9px 11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;overflow:hidden}.cover{aspect-ratio:2/1;background:#e8edf5}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:19px}.head{display:flex;gap:10px}.tag{margin-left:auto;color:var(--a);font-weight:800}.repo,.muted{color:var(--m)}.repo{font:12px monospace}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{border:1px solid var(--l);border-radius:10px;padding:8px}.metric small{color:var(--m)}.signal,.box{margin-top:10px;padding:10px;border:1px solid var(--l);border-radius:11px}summary{font-weight:800;cursor:pointer;margin-top:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{text-decoration:none;border:1px solid var(--l);border-radius:9px;padding:7px 10px;font-weight:800}.primary{background:var(--t);color:var(--b)}table{width:100%;border-collapse:collapse;background:var(--p)}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}@media(max-width:820px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:540px){.toolbar{grid-template-columns:1fr}.hero .w{padding:28px 21px}}</style></head><body><nav><div class="w"><b>GitHub 开源日刊</b><a href="#projects">项目</a><a href="../../archive/">归档</a><button onclick="theme()">◐</button></div></nav><main><section class="hero"><div class="w"><small>DAILY · 2026-08-05</small><h1>6 个跨领域的<br>GitHub 新发现</h1><p class="lead">覆盖文档智能、代码知识、桌面音乐、3D、公共 API 与终端效率。项目事实仅来自 GitHub。</p><div class="meta"><span class="pill">6 个项目</span><span class="pill">6 个领域</span><span class="pill">AI/Agent 2 / 6</span><span class="pill">生成时快照</span></div><div class="dedup">最近 7 天仓库级重复数：0。已比较 2026-08-03 与 2026-08-04 共 17 个历史仓库。</div></div></section><section><div class="w"><h2>快速目录</h2><div class="toc" id="toc"></div></div></section><section id="projects"><div class="w"><div class="toolbar"><input id="q" placeholder="搜索项目、能力或人群"><select id="cat"><option value="">全部分类</option></select><select id="sort"><option value="stars">按 Stars</option><option value="forks">按 Forks</option><option value="name">按名称</option></select><button id="reset">重置</button></div><div id="result" class="muted" style="margin:12px 2px"></div><div id="grid" class="grid"></div></div></section><section><div class="w"><h2>数据快照</h2><div style="overflow:auto"><table><thead><tr><th>项目</th><th>分类</th><th>语言</th><th>License</th><th>Stars</th><th>Forks</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></main><script>const P=[{n:'Unlimited OCR',r:'baidu/Unlimited-OCR',c:'文档智能',l:'Python',x:'MIT',s:22076,f:2232,d:'面向长文档一次性解析的 OCR 项目。',why:'适合复杂 PDF、扫描文档和长页解析团队评估端到端能力。',who:'文档解析、知识库和档案数字化团队',cap:['长文档解析','版面结构恢复','Python 推理入口'],act:'2026-06-18 创建；约 22.1k Stars、2.2k Forks；2026-07-29 最近推送。',risk:'需在目标数据集验证效果、速度和资源占用。'},{n:'OpenWiki',r:'langchain-ai/openwiki',c:'代码知识',l:'TypeScript',x:'MIT',s:14111,f:1006,d:'自动为代码库编写并维护面向 Agent 的项目文档。',why:'把代码理解沉淀为持续更新的知识，而不是一次性回答。',who:'大型代码库、内部开发平台和编码 Agent 团队',cap:['CLI 文档生成','随代码维护知识','项目级上下文'],act:'2026-06-22 创建；约 14.1k Stars、1k Forks；2026-08-04 仍有推送。',risk:'自动文档必须纳入代码评审。'},{n:'Mineradio',r:'XxHuberrr/Mineradio',c:'桌面音乐',l:'JavaScript',x:'NOASSERTION',s:9662,f:755,d:'以电影镜头、粒子视觉和歌词舞台为核心的沉浸式音乐播放器。',why:'适合研究音乐可视化、歌词舞台和桌面媒体交互。',who:'桌面应用、音乐播放器和创意交互开发者',cap:['沉浸式播放界面','歌词舞台','粒子视觉'],act:'2026-06-02 创建；约 9.7k Stars、755 Forks；2026-08-01 最近推送。',risk:'GitHub API 未给出明确 SPDX 许可证，二次开发前需核对许可文件。'},{n:'img2threejs',r:'img2threejs/img2threejs',c:'3D 开发',l:'Python',x:'Apache-2.0',s:9598,f:719,d:'把参考图重建为纯代码、程序化且可动画的 Three.js 模型。',why:'输出是可编辑代码，适合网页 3D、产品演示和可复现资产生产。',who:'Three.js、WebGL 和程序化建模开发者',cap:['图像到程序化模型','质量门控','动画就绪代码'],act:'2026-07-15 创建；约 9.6k Stars、719 Forks；2026-08-03 最近推送。',risk:'复杂几何与材质仍需人工检查。'},{n:'Public APIs',r:'public-apis/public-apis',c:'开发资源',l:'Python',x:'MIT',s:454385,f:50099,d:'按领域整理免费公共 API 的大型社区清单。',why:'是原型验证、数据接入和 API 选型的高效起点。',who:'应用开发者、教学和原型团队',cap:['分类发现 API','认证与 HTTPS 标记','社区维护索引'],act:'约 454k Stars、50k Forks；2026-08-03 最近推送。',risk:'接入前需验证可用性、限流、隐私和商业条款。'},{n:'Oh My Zsh',r:'ohmyzsh/ohmyzsh',c:'终端效率',l:'Shell',x:'MIT',s:189003,f:26575,d:'社区驱动的 Zsh 配置框架，包含插件、主题和自动更新。',why:'适合快速统一终端体验并补全常用工具。',who:'macOS、Linux 终端用户和团队',cap:['300+ 插件','140+ 主题','配置与自动更新'],act:'约 189k Stars、26.6k Forks；2026-08-03 最近推送。',risk:'应按需启用插件并审查第三方代码。'}];const fmt=n=>new Intl.NumberFormat('zh-CN').format(n),url=x=>'https://github.com/'+x.r;function theme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n)}document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';[...new Set(P.map(x=>x.c))].forEach(x=>cat.add(new Option(x,x)));toc.innerHTML=P.map((x,i)=>`<a href="#p${i}">${i+1}. ${x.n}</a>`).join('');tb.innerHTML=P.map(x=>`<tr><td><a href="${url(x)}"><b>${x.n}</b></a></td><td>${x.c}</td><td>${x.l}</td><td>${x.x}</td><td>${fmt(x.s)}</td><td>${fmt(x.f)}</td></tr>`).join('');function render(){let v=q.value.toLowerCase(),a=P.filter(x=>(!cat.value||x.c===cat.value)&&JSON.stringify(x).toLowerCase().includes(v));a.sort((x,y)=>sort.value==='name'?x.n.localeCompare(y.n,'zh-CN'):y[sort.value[0]]-x[sort.value[0]]);grid.innerHTML=a.map(x=>`<article class="card" id="p${P.indexOf(x)}"><div class="cover"><img src="https://opengraph.githubassets.com/20260805/${x.r}" onerror="this.onerror=null;this.src='https://github.com/'+x.r.split('/')[0]+'.png?size=240';this.style.objectFit='contain';this.style.padding='28px'"></div><div class="body"><div class="head"><div><h3>${x.n}</h3><div class="repo">${x.r}</div></div><span class="tag">${x.c}</span></div><p class="muted">${x.d}</p><div class="metrics"><div class="metric"><b>★ ${fmt(x.s)}</b><br><small>Stars</small></div><div class="metric"><b>⑂ ${fmt(x.f)}</b><br><small>Forks</small></div><div class="metric"><b>${x.l}</b><br><small>语言</small></div><div class="metric"><b>${x.x}</b><br><small>License</small></div></div><div class="signal">${x.act}</div><details><summary>展开编辑解读</summary><div class="box"><b>为什么推荐</b><p>${x.why}</p></div><div class="box"><b>主要能力</b><ul>${x.cap.map(v=>`<li>${v}</li>`).join('')}</ul></div><div class="box"><b>适合人群</b><p>${x.who}</p></div><div class="box"><b>采用提醒</b><p>${x.risk}</p></div></details><div class="actions"><a class="btn primary" href="${url(x)}">打开 GitHub</a><a class="btn" href="${url(x)}/commits">Commits</a><a class="btn" href="${url(x)}/issues">Issues</a></div></div></article>`).join('');result.textContent=`显示 ${a.length} / ${P.length} 个项目`}[q,cat,sort].forEach(e=>e.oninput=render);reset.onclick=()=>{q.value='';cat.value='';sort.value='stars';render()};render()</script></body></html>
