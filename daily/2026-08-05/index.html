<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 开源日刊 · 2026-08-05</title><style>:root{--b:#f5f7fb;--p:#fff;--t:#172033;--m:#687386;--l:#dfe5ee;--a:#5b61e8;--s:0 16px 45px #1f2a4418}html[data-theme=dark]{--b:#0d121a;--p:#171e29;--t:#f4f6fa;--m:#a8b1c0;--l:#303a4b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;line-height:1.65}.w{width:min(1120px,calc(100% - 32px));margin:auto}nav{position:sticky;top:0;z-index:20;background:var(--b);border-bottom:1px solid var(--l)}nav .w{min-height:64px;display:flex;align-items:center;gap:14px}nav b{margin-right:auto}a{color:inherit}button,input,select{font:inherit}.hero{padding:52px 0 22px}.hero .w{background:#111827;color:#fff;border-radius:28px;padding:42px}h1{font-size:clamp(2.6rem,6vw,5rem);line-height:1;letter-spacing:-.05em;margin:14px 0}.lead{color:#c8d0dc;max-width:800px}.meta,.toc{display:flex;gap:8px;flex-wrap:wrap}.pill,.toc a{padding:7px 11px;border-radius:999px;border:1px solid var(--l);text-decoration:none}.hero .pill{border-color:#ffffff33}.dedup{margin-top:16px;padding:12px;border-radius:12px;background:#22c55e22;color:#dcffe7}section{padding:24px 0}.toolbar{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:9px;background:var(--p);border:1px solid var(--l);padding:12px;border-radius:16px;position:sticky;top:75px;z-index:10}input,select,button{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:10px;padding:9px 11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;overflow:hidden;box-shadow:var(--s)}.cover{aspect-ratio:2/1;background:#e8edf5}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:19px}.head{display:flex;gap:10px}.tag{margin-left:auto;color:var(--a);font-weight:800}.repo,.muted{color:var(--m)}.repo{font:12px monospace}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{border:1px solid var(--l);border-radius:10px;padding:8px}.metric small{color:var(--m)}.signal,.box{margin-top:10px;padding:10px;border:1px solid var(--l);border-radius:11px}summary{font-weight:800;cursor:pointer;margin-top:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{text-decoration:none;border:1px solid var(--l);border-radius:9px;padding:7px 10px;font-weight:800}.primary{background:var(--t);color:var(--b)}table{width:100%;border-collapse:collapse;background:var(--p)}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}@media(max-width:820px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:540px){.toolbar{grid-template-columns:1fr}.hero .w{padding:28px 21px}}</style></head><body><nav><div class="w"><b>GitHub 开源日刊</b><a href="#projects">项目</a><a href="/github-periodical/archive/">归档</a><button onclick="theme()">◐</button></div></nav><main><section class="hero"><div class="w"><small>DAILY · 2026-08-05</small><h1>6 个跨领域的<br>GitHub 新发现</h1><p class="lead">覆盖文档智能、代码知识、桌面音乐、3D、公共 API 与终端效率。项目事实仅来自 GitHub。</p><div class="meta"><span class="pill">6 个项目</span><span class="pill">6 个领域</span><span class="pill">AI/Agent 2 / 6</span><span class="pill">生成时快照</span></div><div class="dedup">最近 7 天仓库级重复数：0。已比较 2026-08-03 与 2026-08-04 共 17 个历史仓库。</div></div></section><section><div class="w"><h2>快速目录</h2><div class="toc" id="toc"></div></div></section><section id="projects"><div class="w"><div class="toolbar"><input id="q" placeholder="搜索项目、能力或人群"><select id="cat"><option value="">全部分类</option></select><select id="sort"><option value="stars_snapshot">按 Stars</option><option value="forks_snapshot">按 Forks</option><option value="name">按名称</option></select><button id="reset">重置</button></div><div id="result" class="muted" style="margin:12px 2px"></div><div id="grid" class="grid"></div></div></section><section><div class="w"><h2>数据快照</h2><div style="overflow:auto"><table><thead><tr><th>项目</th><th>分类</th><th>语言</th><th>License</th><th>Stars</th><th>Forks</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></main><script>function theme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n)}document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';const f=n=>new Intl.NumberFormat('zh-CN').format(n);let P=[];fetch('/github-periodical/data/projects.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{P=d.projects||[];[...new Set(P.map(x=>x.category))].forEach(x=>cat.add(new Option(x,x)));toc.innerHTML=P.map((x,i)=>`<a href="#p${i}">${i+1}. ${x.name}</a>`).join('');tb.innerHTML=P.map(x=>`<tr><td><a href="${x.url}"><b>${x.name}</b></a></td><td>${x.category}</td><td>${x.language}</td><td>${x.license}</td><td>${f(x.stars_snapshot)}</td><td>${f(x.forks_snapshot)}</td></tr>`).join('');render()});function render(){let s=q.value.toLowerCase(),a=P.filter(x=>(!cat.value||x.category===cat.value)&&JSON.stringify(x).toLowerCase().includes(s));a.sort((x,y)=>sort.value==='name'?x.name.localeCompare(y.name,'zh-CN'):y[sort.value]-x[sort.value]);grid.innerHTML=a.map(x=>`<article class="card" id="p${P.indexOf(x)}"><div class="cover"><img src="https://opengraph.githubassets.com/20260805/${x.repo}" onerror="this.onerror=null;this.src='https://github.com/'+x.repo.split('/')[0]+'.png?size=240';this.style.objectFit='contain';this.style.padding='28px'"></div><div class="body"><div class="head"><div><h3>${x.name}</h3><div class="repo">${x.repo}</div></div><span class="tag">${x.category}</span></div><p class="muted">${x.summary}</p><div class="metrics"><div class="metric"><b>★ ${f(x.stars_snapshot)}</b><br><small>Stars</small></div><div class="metric"><b>⑂ ${f(x.forks_snapshot)}</b><br><small>Forks</small></div><div class="metric"><b>${x.language}</b><br><small>语言</small></div><div class="metric"><b>${x.license}</b><br><small>License</small></div></div><div class="signal">${x.activity_signal}</div><details><summary>展开编辑解读</summary><div class="box"><b>为什么推荐</b><p>${x.recommendation}</p></div><div class="box"><b>主要能力</b><ul>${x.capabilities.map(v=>`<li>${v}</li>`).join('')}</ul></div><div class="box"><b>适合人群</b><p>${x.audience}</p></div><div class="box"><b>采用提醒</b><p>${x.caution}</p></div></details><div class="actions"><a class="btn primary" href="${x.url}">打开 GitHub</a><a class="btn" href="${x.url}/commits">Commits</a><a class="btn" href="${x.url}/issues">Issues</a></div></div></article>`).join('');result.textContent=`显示 ${a.length} / ${P.length} 个项目`}[q,cat,sort].forEach(e=>e.oninput=render);reset.onclick=()=>{q.value='';cat.value='';sort.value='stars_snapshot';render()}</script></body></html>
