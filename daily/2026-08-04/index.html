00}h1{font-size:clamp(2.8rem,7vw,5.8rem);line-height:.98;letter-spacing:-.065em;margin:22px 0 18px;max-width:920px}.lead,.sub{color:var(--muted)}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px}.pill{border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:.86rem;font-weight:800}section{padding:27px 0}h2{font-size:clamp(1.9rem,3vw,2.7rem);letter-spacing:-.045em;margin:0 0 7px}.toc{display:flex;gap:8px;flex-wrap:wrap}.toc a{text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:800}.toolbar{position:sticky;top:79px;z-index:20;border-radius:20px;padding:14px;display:grid;grid-template-columns:1.5fr .8fr .8fr auto;gap:10px}.field,.clear{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:13px;padding:11px 13px}.clear{cursor:pointer;font-weight:850}.result{color:var(--muted);font-size:.9rem;margin:14px 2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{border-radius:24px;overflow:hidden;display:flex;flex-direction:column}.cover{aspect-ratio:2/1;position:relative;background:#e8edf5;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.rank{position:absolute;top:13px;left:13px;padding:5px 9px;border-radius:999px;background:rgba(15,23,42,.78);color:#fff;font-weight:900;font-size:.76rem}.body{padding:21px;display:flex;flex-direction:column;flex:1}.head{display:flex;gap:12px;align-items:flex-start}.head h3{font-size:1.45rem;line-height:1.2;margin:0}.repo{font:12px ui-monospace,monospace;color:var(--muted);margin-top:5px}.tag{margin-left:auto;white-space:nowrap;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--paper));padding:5px 8px;border-radius:999px;font-size:.76rem;font-weight:900}.summary{color:var(--muted);margin:15px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{border:1px solid var(--line);border-radius:12px;padding:9px}.metric b{display:block;font-size:.91rem}.metric span{font-size:.68rem;color:var(--muted)}.signal{margin-top:12px;color:var(--green);background:color-mix(in srgb,var(--green) 9%,var(--paper));padding:10px 11px;border-radius:12px;font-size:.84rem;font-weight:750}details{margin-top:13px;border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;font-weight:900}.box{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}.box p,.box ul{color:var(--muted);margin:0}.box ul{padding-left:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:16px}.btn{display:inline-flex;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:850}.btn.primary{background:var(--text);color:var(--bg)}.panel{border-radius:24px;padding:23px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.74rem}footer{padding:42px 0 65px;color:var(--muted);font-size:.9rem}@media(max-width:900px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.toolbar{grid-template-columns:1fr}}</style></head><body><header class="top"><nav class="wrap"><a class="logo" href="/github-periodical/">GH</a><span class="brand">GitHub 开源日刊</span><div class="links"><a href="#projects">项目</a><a href="#snapshot">快照</a><a href="/github-periodical/archive/">历史归档</a><a href="https://github.com/waterfly9527-ui/github-periodical">本站仓库</a><button onclick="theme()">◐</button></div></nav></header><main><section class="hero"><div class="wrap"><div class="hero-box"><span class="kicker">DAILY · 2026-08-04</span><h1>5 个值得立即试用的<br>新开源项目</h1><p class="lead">本期避开上一版已推荐项目，聚焦原生编译、Agent 沙箱、AI CRM、推理基础设施和边缘数据库 AI。</p><div class="meta"><span class="pill">快照：2026-08-04</span><span class="pill">项目：5</span><span class="pill">来源：仅 GitHub</span><span class="pill">数字为生成时快照</span></div></div></div></section><section><div class="wrap"><h2>快速目录</h2><div class="toc" id="toc"></div></div></section><section id="projects"><div class="wrap"><div class="toolbar"><input id="q" class="field" type="search" placeholder="搜索项目、能力、语言或人群…"><select id="cat" class="field"><option value="">全部分类</option></select><select id="sort" class="field"><option value="stars">按 Stars</option><option value="forks">按 Forks</option><option value="name">按名称</option></select><button id="reset" class="clear">重置</button></div><div id="result" class="result"></div><div id="grid" class="grid"></div></div></section><section id="snapshot"><div class="wrap"><h2>数据快照</h2><p class="sub">Star、Fork、提交和发布数量均来自生成时可见的 GitHub 仓库页面。</p><div class="panel"><table><thead><tr><th>项目</th><th>分类</th><th>语言</th><th>License</th><th>Stars</th><th>Forks</th></tr></thead><tbody id="tb"></tbody></table></div></div></section></main><footer><div class="wrap">项目事实仅来自 GitHub；推荐理由与采用提醒为编辑判断。<a href="/github-periodical/archive/">查看历史期刊</a>。</div></footer><script>const P=[{"name":"scriptc","repo":"vercel-labs/scriptc","category":"编译工具","language":"TypeScript","license":"Apache-2.0","stars":1900,"forks":34,"summary":"把普通 TypeScript 编译成无需 Node、V8 或 JavaScript 引擎的原生可执行文件。","reason":"保留 TypeScript 类型检查与常用 Node API，同时输出约 170–200KB 静态二进制，适合 CLI、边缘任务和低内存部署。","audience":"TypeScript 工具作者、CLI 开发者、希望减少 Node 运行时依赖的团队。","capabilities":["原生编译普通 TypeScript","静态覆盖率与阻塞诊断","差分测试和 ASan 校验"],"activity":"仓库约 286 次提交，持续补齐语言与 Node API 覆盖面。","caution":"macOS arm64 是主要平台，跨平台与动态 npm 依赖需验证。"},{"name":"AgentENV","repo":"kvcache-ai/AgentENV","category":"Agent 基础设施","language":"Rust","license":"Apache-2.0","stars":882,"forks":75,"summary":"面向大规模 Agent 环境运行的分布式沙箱平台，基于 Firecracker 微虚拟机。","reason":"提供毫秒级启动、暂停、恢复、快照和分叉，适合 Agent RL、批量评测与并行工具执行。","audience":"训练 Agent、建设评测平台或需要高密度隔离环境的团队。","capabilities":["Firecracker 与 OCI 镜像按需加载","增量快照与环境分叉","兼容 E2B API"],"activity":"仓库约 10 次提交，项目处于快速早期阶段。","caution":"当前无内置鉴权，只应部署在可信网络或鉴权代理后。"},{"name":"Relaticle","repo":"relaticle/relaticle","category":"业务应用","language":"PHP","license":"AGPL-3.0","stars":1300,"forks":147,"summary":"内置 AI Agent 与 30 个 MCP 工具的自托管开源 CRM。","reason":"联系人、公司、任务和商机可由 Agent 通过 MCP 与 REST API 操作。","audience":"希望自托管 CRM、集成 Agent 或替换封闭 SaaS 的团队。","capabilities":["完整 CRM 数据模型","30 个 MCP 工具和 REST API","Laravel 与 Filament 自托管"],"activity":"GitHub 页面显示 48 个 Releases，版本线持续维护。","caution":"AGPL-3.0 对网络服务分发有强开源要求。"},{"name":"Mooncake","repo":"kvcache-ai/Mooncake","category":"推理基础设施","language":"C++","license":"Apache-2.0","stars":5400,"forks":791,"summary":"为大模型推理设计的 KV Cache 解耦与高性能数据传输平台。","reason":"把预填充、解码与 KV Cache 传输解耦，适合 vLLM、SGLang 大规模服务。","audience":"运营多 GPU 推理集群或构建高吞吐模型服务的团队。","capabilities":["RDMA 高速传输","KV Cache 解耦与分布式存储","协同 vLLM 与 SGLang"],"activity":"超过 1,250 次提交、约 27 个 Releases。","caution":"依赖复杂硬件与网络栈，更适合专业基础设施团队。"},{"name":"SQLite-AI","repo":"sqliteai/sqlite-ai","category":"边缘 AI","language":"C","license":"Elastic-2.0","stars":131,"forks":13,"summary":"把模型推理、Embedding 和流式生成直接带进 SQLite 的 AI 原生扩展。","reason":"可通过 SQL 在设备本地运行模型和生成向量，适合离线与低延迟应用。","audience":"移动端、桌面端、IoT 和本地优先 AI 开发者。","capabilities":["SQLite 内模型推理与 Embedding","SQL 聚合函数流式输出","设备端低延迟集成"],"activity":"GitHub 页面显示 28 个 Releases。","caution":"Elastic-2.0 对生产和托管服务有限制。"}];P.forEach(x=>{x.url='https://github.com/'+x.repo;x.image='https://opengraph.githubassets.com/20260804/'+x.repo;x.fallback='https://github.com/'+x.repo.split('/')[0]+'.png?size=240'});const f=n=>new Intl.NumberFormat('zh-CN').format(n);function theme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n)}document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';const q=document.getElementById('q'),cat=document.getElementById('cat'),sort=document.getElementById('sort'),grid=document.getElementById('grid');[...new Set(P.map(x=>x.category))].forEach(x=>cat.add(new Option(x,x)));toc.innerHTML=P.map((x,i)=>`<a href="#p${i}">${i+1}. ${x.name}</a>`).join('');tb.innerHTML=P.map(x=>`<tr><td><a href="${x.url}"><b>${x.name}</b></a></td><td>${x.category}</td><td>${x.language}</td><td>${x.license}</td><td>${f(x.stars)}</td><td>${f(x.forks)}</td></tr>`).join('');function render(){let s=q.value.toLowerCase(),a=P.filter(x=>(!cat.value||x.category===cat.value)&&JSON.stringify(x).toLowerCase().includes(s));a.sort((x,y)=>sort.value==='name'?x.name.localeCompare(y.name):y[sort.value]-x[sort.value]);grid.innerHTML=a.map((x,i)=>`<article class="card" id="p${P.indexOf(x)}"><div class="cover"><img src="${x.image}" onerror="this.onerror=null;this.src='${x.fallback}';this.style.objectFit='contain';this.style.padding='30px'"><span class="rank">#${i+1}</span></div><div class="body"><div class="head"><div><h3>${x.name}</h3><div class="repo">${x.repo}</div></div><span class="tag">${x.category}</span></div><p class="summary">${x.summary}</p><div class="metrics"><div class="metric"><b>★ ${f(x.stars)}</b><span>Stars</span></div><div class="metric"><b>⑂ ${f(x.forks)}</b><span>Forks</span></div><div class="metric"><b>${x.language}</b><span>语言</span></div><div class="metric"><b>${x.license}</b><span>License</span></div></div><div class="signal">${x.activity}</div><details><summary>展开编辑解读</summary><div class="box"><b>为什么推荐</b><p>${x.reason}</p></div><div class="box"><b>主要能力</b><ul>${x.capabilities.map(v=>`<li>${v}</li>`).join('')}</ul></div><div class="box"><b>适合人群</b><p>${x.audience}</p></div><div class="box"><b>采用提醒</b><p>${x.caution}</p></div></details><div class="actions"><a class="btn primary" href="${x.url}">打开 GitHub</a><a class="btn" href="${x.url}/commits">提交记录</a><a class="btn" href="${x.url}/issues">Issues</a></div></div></article>`).join('');result.textContent=`显示 ${a.length} / ${P.length} 个项目`}[q,cat,sort].forEach(e=>e.oninput=render);reset.onclick=()=>{q.value='';cat.value='';sort.value='stars';render()};render();</script></body></html>
