name: Daily GitHub Periodical Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-periodical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare update workspace
        run: |
          mkdir -p daily/$(date -u +%Y-%m-%d)
          echo "Daily update placeholder generated at $(date -u)" > daily/$(date -u +%Y-%m-%d)/UPDATE.txt

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: daily periodical update"
          git push
